<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="400" viewBox="0 0 480 400" role="img" aria-label="A mint-green 3D robot sways at its desktop console">
<style>
@keyframes sway{0%,100%{transform:rotate(-1.4deg) scale(1)}50%{transform:rotate(1.4deg) scale(1.035)}}
.r{transform-origin:240px 330px;animation:sway 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.r{animation:none}}
</style>
<rect width="480" height="400" fill="#28394f"/>
<g class="r"><image width="480" height="400" href="data:image/jpeg;base64,"/></g>
</svg>
