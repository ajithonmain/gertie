<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
<style>
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.g19x__geometry-motion{display:none}.g19x__geometry-poster{display:inline}}
</style>
<defs>
<linearGradient id="g19x-bar__grad" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="-40" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#1e3a8a"/><animate attributeName="x1" dur="2s" repeatCount="indefinite" calcMode="spline" values="-120;40;-120" keyTimes="0;0.5;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1"/><animate attributeName="x2" dur="2s" repeatCount="indefinite" calcMode="spline" values="-40;120;-40" keyTimes="0;0.5;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1"/></linearGradient>
<linearGradient id="g19x-bar__grad__poster" href="#g19x-bar__grad" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="-40" y2="0"/>
<radialGradient id="g19x-orb__grad" gradientUnits="userSpaceOnUse" cx="-16" cy="-16" r="60"><stop offset="0" stop-color="#fef3c7"/><stop offset="0.55" stop-color="#f59e0b"/><stop offset="1" stop-color="#9a3412"/><animate attributeName="cx" dur="2s" repeatCount="indefinite" calcMode="spline" values="-16;16;-16" keyTimes="0;0.5;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1"/><animate attributeName="cy" dur="2s" repeatCount="indefinite" calcMode="spline" values="-16;12;-16" keyTimes="0;0.5;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1"/><animate attributeName="r" dur="2s" repeatCount="indefinite" calcMode="spline" values="60;80;60" keyTimes="0;0.5;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1"/></radialGradient>
<radialGradient id="g19x-orb__grad__poster" href="#g19x-orb__grad" gradientUnits="userSpaceOnUse" cx="-16" cy="-16" r="60"/>
</defs>
<rect width="320" height="200" fill="#0b1220"/>
<g transform="translate(160 50)">
<g class="g19x__geometry-motion">
<rect x="-120" y="-20" width="240" height="40" rx="20" fill="url(#g19x-bar__grad)"/>
</g>
<g class="g19x__geometry-poster" display="none">
<rect x="-120" y="-20" width="240" height="40" rx="20" fill="url(#g19x-bar__grad__poster)"/>
</g>
</g>
<g transform="translate(160 135)">
<g class="g19x__geometry-motion">
<ellipse rx="44" ry="44" fill="url(#g19x-orb__grad)"/>
</g>
<g class="g19x__geometry-poster" display="none">
<ellipse rx="44" ry="44" fill="url(#g19x-orb__grad__poster)"/>
</g>
</g>
</svg>
