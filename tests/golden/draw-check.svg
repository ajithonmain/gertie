<style>
@keyframes gzg6-disc__s{0%{transform:scale(0,0);animation-timing-function:cubic-bezier(0.34,1.56,0.64,1)}30.5555%{transform:scale(1,1);animation-timing-function:step-end}100%{transform:scale(1,1)}}
