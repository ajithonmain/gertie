<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
</style>
<script src="lottie.min.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  window.consoleLog = [];
  for (const level of ["error", "warn"]) {
    const orig = console[level].bind(console);
    console[level] = (...a) => { window.consoleLog.push({ level, text: a.map(String).join(" ") }); orig(...a); };
  }
  window.addEventListener("error", (e) => window.consoleLog.push({ level: "error", text: String(e.message) }));
  window.loadLottie = (data) => new Promise((resolve, reject) => {
    const stage = document.getElementById("stage");
    stage.style.width = data.w + "px";
    stage.style.height = data.h + "px";
    const anim = lottie.loadAnimation({ container: stage, renderer: "svg", loop: false, autoplay: false, animationData: data });
    // lottie-web may fire DOMLoaded before a listener can be attached, so check isLoaded first.
    const ready = () => {
      window.anim = anim;
      window.seek = (frame) => anim.goToAndStop(frame, true);
      resolve({ totalFrames: anim.totalFrames, frameRate: anim.frameRate });
    };
    if (anim.isLoaded) ready();
    else anim.addEventListener("DOMLoaded", ready);
    anim.addEventListener("data_failed", () => reject(new Error("lottie-web could not load the animation data")));
  });

  // ---- animated SVG: inline, seeked frame by frame ----
  window.loadSvg = async (text, fps) => {
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    const bad = doc.querySelector("parsererror");
    if (bad) throw new Error("The SVG is not well-formed XML: " + bad.textContent.slice(0, 200));
    const stage = document.getElementById("stage");
    const svg = document.importNode(doc.documentElement, true);
    stage.replaceChildren(svg);
    stage.style.width = svg.getAttribute("width") + "px";
    stage.style.height = svg.getAttribute("height") + "px";
    svg.style.display = "block";
    // Embedded images load asynchronously. Wait so the first screenshot is complete.
    await Promise.all([...svg.querySelectorAll("image")].map(async (im) => {
      const img = new Image();
      img.src = im.getAttribute("href") || "";
      try { await img.decode(); } catch (e) { /* an empty or broken image is reported by the checks */ }
    }));
    window.seek = (frame) => {
      const sec = frame / fps;
      for (const a of document.getAnimations()) { a.pause(); a.currentTime = sec * 1000; }
      svg.pauseAnimations();
      svg.setCurrentTime(sec);
    };
    window.seek(0);
    return { totalFrames: 0, frameRate: fps };
  };
  // Screen rectangles of shape elements (class ends in __sh), used to name the node behind a parity failure.
  window.nodeBoxes = () => [...document.querySelectorAll('[class*="__sh"]')].map((el) => {
    const r = el.getBoundingClientRect();
    return { cls: el.getAttribute("class"), x: r.x, y: r.y, w: r.width, h: r.height };
  });
  // Alpha-weighted pixel distance, 0 to 255.
  function dist(A, i, B, j) {
    const a = A[i + 3], b = B[j + 3];
    return Math.max(Math.abs(a - b), Math.abs(A[i] * a - B[j] * b) / 255, Math.abs(A[i + 1] * a - B[j + 1] * b) / 255, Math.abs(A[i + 2] * a - B[j + 2] * b) / 255);
  }
  // Fuzzy comparison for two independent renderers: a pixel counts as different only when no pixel
  // within one pixel of it in the other image matches. Anti-aliasing and sub-pixel shifts do not count.
  function fuzzyDiffers(IA, IB, x, y, tol) {
    const w = IA.width, h = IA.height, A = IA.data, B = IB.data;
    const i = (y * w + x) * 4;
    if (dist(A, i, B, i) <= tol) return false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      const j = (yy * w + xx) * 4;
      if (dist(A, i, B, j) <= tol || dist(A, j, B, i) <= tol) return false;
    }
    return true;
  }
  window.makeDiff = async (a, b, tol) => {
    const A = await decode(a), B = await decode(b);
    const out = new ImageData(A.width, A.height);
    for (let y = 0; y < A.height; y++) for (let x = 0; x < A.width; x++) {
      const i = (y * A.width + x) * 4;
      if (fuzzyDiffers(A, B, x, y, tol)) { out.data[i] = 255; out.data[i + 1] = 40; out.data[i + 2] = 40; out.data[i + 3] = 255; }
      else { out.data[i] = A.data[i]; out.data[i + 1] = A.data[i + 1]; out.data[i + 2] = A.data[i + 2]; out.data[i + 3] = A.data[i + 3] >> 2; }
    }
    const c = document.createElement("canvas");
    c.width = A.width; c.height = A.height;
    c.getContext("2d").putImageData(out, 0, 0);
    return c.toDataURL("image/png").split(",")[1];
  };

  // ---- pixel analysis and contact sheets (no image library needed) ----
  async function decode(b64) {
    const img = new Image();
    img.src = "data:image/png;base64," + b64;
    await img.decode();
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    return ctx.getImageData(0, 0, c.width, c.height);
  }
  // ref: [r, g, b, a] of the empty scene (a is 0 to 255). A pixel is content when it differs from ref.
  window.analyzeFrames = async (b64s, pairs, ref, tol, premult) => {
    const images = [];
    for (const b of b64s) images.push(await decode(b));
    const isContent = (d, i) => {
      if (ref[3] === 0) return d[i + 3] > 8;
      return Math.abs(d[i] - ref[0]) > tol || Math.abs(d[i + 1] - ref[1]) > tol || Math.abs(d[i + 2] - ref[2]) > tol || Math.abs(d[i + 3] - ref[3]) > tol;
    };
    const frames = images.map((im) => {
      const { width: w, height: h, data: d } = im;
      let content = 0, edge = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (isContent(d, i)) { content++; if (x === 0 || y === 0 || x === w - 1 || y === h - 1) edge++; }
      }
      return { width: w, height: h, content: content / (w * h), edge: edge / (2 * (w + h) - 4) };
    });
    const diffs = pairs.map(([a, b]) => {
      const IA = images[a], IB = images[b];
      const A = IA.data, B = IB.data;
      const n = A.length / 4;
      let diff = 0, minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
      const w = IA.width;
      for (let p = 0; p < n; p++) {
        const i = p * 4;
        const x = p % w, y = (p / w) | 0;
        let differs;
        if (premult) differs = fuzzyDiffers(IA, IB, x, y, tol);
        else {
          const dA = Math.abs(A[i + 3] - B[i + 3]);
          const dc = Math.max(Math.abs(A[i] - B[i]), Math.abs(A[i + 1] - B[i + 1]), Math.abs(A[i + 2] - B[i + 2]));
          differs = dA > tol || (A[i + 3] > 8 && B[i + 3] > 8 && dc > tol);
        }
        if (differs) {
          diff++;
          if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      return { fraction: diff / n, bbox: diff ? [minX, minY, maxX, maxY] : null };
    });
    return { frames, diffs };
  };

  window.makeSheet = async (b64s, labels, cols, cellW, background) => {
    const images = [];
    for (const b of b64s) images.push(await decode(b));
    const aspect = images[0].height / images[0].width;
    const cellH = Math.round(cellW * aspect);
    const pad = 8, labelH = 22;
    const rows = Math.ceil(images.length / cols);
    const W = cols * (cellW + pad) + pad, H = rows * (cellH + labelH + pad) + pad;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0b0b0d"; ctx.fillRect(0, 0, W, H);
    const tile = document.createElement("canvas");
    for (let k = 0; k < images.length; k++) {
      const x = pad + (k % cols) * (cellW + pad);
      const y = pad + Math.floor(k / cols) * (cellH + labelH + pad);
      // checkerboard so transparency is visible
      for (let ty = 0; ty < cellH; ty += 12) for (let tx = 0; tx < cellW; tx += 12) {
        ctx.fillStyle = ((tx / 12 + ty / 12) % 2 === 0) ? "#2a2a30" : "#1d1d22";
        ctx.fillRect(x + tx, y + labelH + ty, Math.min(12, cellW - tx), Math.min(12, cellH - ty));
      }
      tile.width = images[k].width; tile.height = images[k].height;
      tile.getContext("2d").putImageData(images[k], 0, 0);
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(tile, x, y + labelH, cellW, cellH);
      ctx.fillStyle = "#a1a1aa"; ctx.font = "13px ui-monospace, Menlo, monospace"; ctx.textBaseline = "middle";
      ctx.fillText(labels[k], x, y + labelH / 2);
    }
    return c.toDataURL("image/png").split(",")[1];
  };
</script>
</body>
</html>
